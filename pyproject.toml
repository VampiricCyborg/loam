[project]
name = "loam"
version = "0.1.0"
description = "A readable, instrumented HNSW vector index in pure Python."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Madhav", email = "madhavmsoff030307@gmail.com" }]
keywords = ["hnsw", "ann", "vector-search", "nearest-neighbors", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
    "h5py>=3.11",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "hypothesis>=6.100"]
reference = ["hnswlib>=0.8.0"]

[project.scripts]
loam = "loam.cli:app"

[project.urls]
Homepage = "https://github.com/VampiricCyborg/Loam"
Repository = "https://github.com/VampiricCyborg/Loam"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8.2", "hypothesis>=6.100"]
